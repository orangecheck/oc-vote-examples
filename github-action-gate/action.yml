name: 'OC Vote Gate'
description: 'Gate a job on an OC Vote poll tally (https://vote.ochk.io)'
author: 'OrangeCheck'
branding:
    icon: 'check-circle'
    color: 'orange'

inputs:
    poll-id:
        description: '64-hex OC Vote poll id'
        required: true
    pass-condition:
        description: 'jq expression over the /api/tally response; must be truthy'
        required: false
        default: '.tallies.yes > .tallies.no'
    min-voters:
        description: 'reject if turnout.voters is below this'
        required: false
        default: '0'
    require-closed:
        description: "if 'true', pass only once the answer's deadline has passed; an answer with no deadline fails"
        required: false
        default: 'false'
    awaiting-reveal-is:
        description: "'fail' or 'pass' — how to treat secret-mode polls pre-reveal"
        required: false
        default: 'fail'
    tally-base-url:
        description: 'override /api/tally base URL'
        required: false
        default: 'https://vote.ochk.io/api/tally'

outputs:
    state:
        description: 'tallied, awaiting_reveal or provisional; not set when /api/tally answers non-200'
        value: ${{ steps.gate.outputs.state }}
    passed:
        description: 'true or false'
        value: ${{ steps.gate.outputs.passed }}
    tally-json:
        description: 'full JSON response'
        value: ${{ steps.gate.outputs.tally-json }}

runs:
    using: 'composite'
    steps:
        - id: gate
          shell: bash
          env:
              POLL_ID: ${{ inputs.poll-id }}
              PASS_COND: ${{ inputs.pass-condition }}
              MIN_VOTERS: ${{ inputs.min-voters }}
              REQUIRE_CLOSED: ${{ inputs.require-closed }}
              AWAITING_REVEAL_IS: ${{ inputs.awaiting-reveal-is }}
              BASE: ${{ inputs.tally-base-url }}
          run: |
              set -euo pipefail

              # Text from the server goes into workflow commands, so it is escaped the
              # way the Actions toolkit escapes command data: % CR LF. A server word can
              # then never start a line of its own, such as ::add-mask:: or a second
              # ::error::.
              esc() {
                  local s=$1
                  s=${s//'%'/'%25'}
                  s=${s//$'\r'/'%0D'}
                  s=${s//$'\n'/'%0A'}
                  printf '%s' "$s"
              }
              fail() {
                  echo "::error::$(esc "$1")"
                  exit 1
              }

              if ! [[ "$POLL_ID" =~ ^[0-9a-f]{64}$ ]]; then
                  fail "poll-id must be 64 hex chars (got: $POLL_ID)"
              fi
              if ! [[ "$MIN_VOTERS" =~ ^[0-9]+$ ]]; then
                  fail "min-voters must be a whole number (got: $MIN_VOTERS)"
              fi

              # Read the status and the body ourselves: curl -f would turn a 409,
              # a 422 or a 503 into "returned error" and drop what the answer says.
              body_file=$(mktemp)
              head_file=$(mktemp)
              trap 'rm -f "$body_file" "$head_file"' EXIT
              if ! status=$(curl -sS -o "$body_file" -D "$head_file" -w '%{http_code}' "$BASE?poll=$POLL_ID"); then
                  fail "could not reach $BASE: no answer, nothing was read. Run this job again."
              fi
              tally=$(cat "$body_file")
              # A body that is not JSON (a proxy's error page) is shown as text.
              if ! jq -e . <<< "$tally" > /dev/null 2>&1; then
                  fail "/api/tally answered $status with a body that is not JSON: ${tally:0:200}"
              fi
              # jq prints every string quoted and escaped, so no line of this starts a command.
              echo "::group::tally response ($status)"
              echo "$tally" | jq .
              echo "::endgroup::"

              if [[ "$status" != "200" ]]; then
                  # A code is snake_case; an error that is a sentence is the words.
                  code=$(jq -r '.code // .state // (.error | strings | select(test("^[a-z][a-z0-9_]*$"))) // empty' <<< "$tally")
                  words=$(jq -r '.reason // .detail // (.error | strings | select(test("^[a-z][a-z0-9_]*$") | not)) // empty' <<< "$tally")
                  case "$status" in
                      409) next="The tally is deferred, not final yet: run this job again later." ;;
                      503) next="A relay or chain read did not finish, so nothing was counted: run this job again." ;;
                      429)
                          wait_s=$(awk 'tolower($1) == "retry-after:" { print $2 }' "$head_file" | tr -d '\r')
                          [[ "$wait_s" =~ ^[0-9]+$ ]] || wait_s=60
                          next="Too many tallies asked: run this job again in $wait_s seconds." ;;
                      404)
                          poll_of_event=$(jq -r '.poll_id // empty' <<< "$tally")
                          if [[ "$poll_of_event" =~ ^[0-9a-f]{64}$ ]]; then
                              next="That id is a poll's Nostr event: set poll-id to $poll_of_event."
                          else
                              next="Check poll-id."
                          fi ;;
                      422) next="The poll itself is invalid, so it can never pass." ;;
                      500) next="The tally failed on the server: run this job again." ;;
                      *) next="" ;;
                  esac
                  fail "/api/tally answered $status${code:+ ($code)}${words:+: $words}. $next"
              fi

              # Only a state from the known set is written as an output: anything else
              # could carry a newline and add a line of its own to $GITHUB_OUTPUT.
              state=$(jq -r '.state' <<< "$tally")
              case "$state" in
                  tallied | provisional | awaiting_reveal) ;;
                  *) fail "/api/tally answered state $state, which this action does not know" ;;
              esac
              echo "state=$state" >> "$GITHUB_OUTPUT"
              # Re-written by jq on one line, so the body can carry no newline into the file.
              echo "tally-json=$(jq -c . <<< "$tally")" >> "$GITHUB_OUTPUT"

              if [[ "$state" == "awaiting_reveal" ]]; then
                  case "$AWAITING_REVEAL_IS" in
                      pass)
                          echo "awaiting_reveal → treated as pass"
                          echo "passed=true" >> "$GITHUB_OUTPUT"
                          exit 0
                          ;;
                      *)
                          echo "passed=false" >> "$GITHUB_OUTPUT"
                          fail "poll is awaiting_reveal — treated as fail (set awaiting-reveal-is: pass to allow)"
                          ;;
                  esac
              fi

              if [[ "$state" == "provisional" ]]; then
                  unanchored=$(jq -r '.unanchored | numbers' <<< "$tally")
                  because=$(jq -r '.not_final_because // empty' <<< "$tally")
                  echo "passed=false" >> "$GITHUB_OUTPUT"
                  fail "poll is provisional: an anchored poll's count is not final until the chain is 6 blocks past its close (plus the grace), so the counts may still change${unanchored:+; $unanchored counted ballot(s) have no anchor yet}${because:+; not final because: $because}. Run this job again later."
              fi

              if [[ "$REQUIRE_CLOSED" == "true" ]]; then
                  # A poll whose deadline is missing or unreadable is not taken as closed.
                  deadline=$(jq -r '.deadline // empty' <<< "$tally")
                  if [[ -z "$deadline" ]]; then
                      echo "passed=false" >> "$GITHUB_OUTPUT"
                      fail "require-closed=true but /api/tally sent no deadline, so this action cannot tell the poll is closed"
                  fi
                  now_epoch=$(date +%s)
                  # Only an ISO 8601 UTC time goes to date, which would also take a
                  # parenthesised comment.
                  deadline_epoch=
                  if [[ "$deadline" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
                      deadline_epoch=$(date -u -d "$deadline" +%s 2>/dev/null || date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$deadline" +%s 2>/dev/null || true)
                  fi
                  if ! [[ "$deadline_epoch" =~ ^-?[0-9]+$ ]]; then
                      echo "passed=false" >> "$GITHUB_OUTPUT"
                      fail "require-closed=true but the deadline could not be read: $deadline"
                  fi
                  if (( deadline_epoch > now_epoch )); then
                      echo "passed=false" >> "$GITHUB_OUTPUT"
                      fail "require-closed=true but deadline $deadline is in the future"
                  fi
              fi

              # A count from the server is compared only once it is a whole number: bash
              # evaluates the operands of -lt, and a string like a[$(...)] would run.
              voters=$(jq -r '.turnout.voters // 0' <<< "$tally")
              if ! [[ "$voters" =~ ^[0-9]+$ ]]; then
                  echo "passed=false" >> "$GITHUB_OUTPUT"
                  fail "/api/tally answered a voter count that is not a whole number: $voters"
              fi
              if (( 10#$voters < 10#$MIN_VOTERS )); then
                  echo "passed=false" >> "$GITHUB_OUTPUT"
                  fail "only $voters voter(s) — min-voters is $MIN_VOTERS"
              fi

              if ! jq -e "$PASS_COND" <<< "$tally" > /dev/null; then
                  echo "passed=false" >> "$GITHUB_OUTPUT"
                  fail "pass-condition ($PASS_COND) evaluated false"
              fi

              echo "passed=true" >> "$GITHUB_OUTPUT"
              echo "✓ poll $POLL_ID passed"
